name: maxhouse
services:
  bot:
    build: .
    # Переменные бота. По умолчанию .env в каталоге проекта; другой файл —
    # BOT_ENV_FILE=/path/to/file.
    env_file:
      - path: ${BOT_ENV_FILE:-.env}
        required: false
    volumes:
      - botlogs:/var/log/bot
    stop_grace_period: ${BOT_STOP_GRACE_PERIOD:-30s}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /readyz: процесс жив и Postgres с Redis доступны.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=pgx5://${DB_USER:-bot}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-bot}?sslmode=disable
      - up
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-bot}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    volumes:
      - ./deploy/nginx/webhook.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${WEBHOOK_CERTS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sk", "-o", "/dev/null", "--max-time", "4", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

volumes:
  pgdata:
  redisdata:
  botlogs:
